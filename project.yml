# XcodeGen spec — run `xcodegen` to (re)generate MacPad++.xcodeproj (the .xcodeproj is not checked in).
# Prerequisite: scripts/build-deps.sh (builds build/deps/Scintilla.framework and liblexilla.a).
name: MacPad++
options:
  bundleIdPrefix: app.macpad
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacPad++:
    type: application
    platform: macOS
    sources:
      - path: MacPad/Sources
      - path: MacPad/Resources
      - path: MacPad/Shared
    settings:
      base:
        PRODUCT_NAME: MacPad++
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: MacPad
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad
        INFOPLIST_FILE: MacPad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MacPad/Sources/BridgingHeader.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        OTHER_LDFLAGS: [-llexilla, -luchardet, -lc++]
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - framework: build/deps/Scintilla.framework
        embed: true
        codeSign: true
      # MAC-24: the helper binary goes into Contents/MacOS (the plist's BundleProgram).
      - target: MacPadHelper
        embed: true
        copy:
          destination: executables
    scheme:
      testTargets:
        - MacPad++Tests
      gatherCoverageData: true
    preBuildScripts:
      - name: Copy Notepad++ data files
        basedOnDependencyAnalysis: false
        script: |
          # Data files are reused verbatim from Notepad++ (vendor/ is gitignored, read-only).
          set -e
          NPP="$PROJECT_DIR/vendor/notepad-plus-plus/PowerEditor"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/npp"
          mkdir -p "$DEST"
          cp "$NPP/src/langs.model.xml" "$NPP/src/stylers.model.xml" "$DEST/"
          rsync -a --delete "$NPP/installer/themes/" "$DEST/themes/"

  # MAC-24: privileged helper (launchd daemon via SMAppService); runs as root, writes one file per
  # request, only for MacPad++ signed by the same team.
  MacPadHelper:
    type: tool
    platform: macOS
    sources:
      - path: MacPad/Helper
      - path: MacPad/Shared
    settings:
      base:
        PRODUCT_NAME: MacPadHelper
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad.helper
        OTHER_CODE_SIGN_FLAGS: "--identifier app.macpad.MacPad.helper"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO

  MacPad++Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacPadTests
    settings:
      base:
        PRODUCT_NAME: MacPad++Tests
        PRODUCT_MODULE_NAME: MacPadTests
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPadTests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: MacPad++
