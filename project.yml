# XcodeGen spec — run `xcodegen` to (re)generate Inkpad++.xcodeproj (the .xcodeproj is not checked in).
# Prerequisite: scripts/build-deps.sh (builds build/deps/Scintilla.framework and liblexilla.a).
name: Inkpad++
options:
  bundleIdPrefix: app.inkpad
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: "1.1.6"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Inkpad++:
    type: application
    platform: macOS
    # MAC-66: APP_DISPLAY_NAME (the visible name), overridable in a gitignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: Inkpad/Sources
      - path: Inkpad/Resources
      - path: Inkpad/Shared
      - path: Inkpad/CommandLine
    settings:
      base:
        PRODUCT_NAME: Inkpad++
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: Inkpad
        PRODUCT_BUNDLE_IDENTIFIER: app.inkpad.Inkpad
        INFOPLIST_FILE: Inkpad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Inkpad/Sources/BridgingHeader.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        OTHER_LDFLAGS: [-llexilla, -luchardet, -lc++]
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # A Debug build has its own bundle id: Finder / Open With never picks it over the
        # installed app, and it never shares the installed app's preferences.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.inkpad.Inkpad.debug
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: build/deps/Scintilla.framework
        embed: true
        codeSign: true
      # MAC-24: the helper binary goes into Contents/MacOS; postinstall copies it to
      # /Library/PrivilegedHelperTools (MAC-56).
      - target: InkpadHelper
        embed: true
        copy:
          destination: executables
      # MAC-52: the inkpad command-line tool, linked into /usr/local/bin by the package.
      - target: inkpad
        embed: true
        copy:
          destination: executables
    scheme:
      testTargets:
        - Inkpad++Tests
      gatherCoverageData: true
    preBuildScripts:
      - name: Copy upstream data files
        basedOnDependencyAnalysis: false
        script: |
          # Data files are reused verbatim from upstream (vendor/ is gitignored, read-only).
          set -e
          NPP="$PROJECT_DIR/vendor/upstream/PowerEditor"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/upstream"
          mkdir -p "$DEST"
          cp "$NPP/src/langs.model.xml" "$NPP/src/stylers.model.xml" "$DEST/"
          rsync -a --delete "$NPP/installer/themes/" "$DEST/themes/"
          cp "$PROJECT_DIR/Themes/"*.xml "$DEST/themes/"  # MAC-80: Inkpad's own themes (Inkpad Light)
          rsync -a --delete "$NPP/installer/functionList/" "$DEST/functionList/"
          # MAC-69: upstream's Fluent UI toolbar icons (light/dark, regular/filled), for the toolbar option.
          for look in light dark; do
            mkdir -p "$DEST/icons/$look"
            rsync -a --delete "$NPP/src/icons/$look/toolbar/" "$DEST/icons/$look/toolbar/"
          done
      - name: Localized display name
        basedOnDependencyAnalysis: false
        script: |
          # MAC-66: Finder, the Dock and Spotlight show the file name (Inkpad++.app) unless the
          # bundle has a localized name (LSHasLocalizedDisplayName); this one is APP_DISPLAY_NAME.
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          NAME=$(printf '%s' "$APP_DISPLAY_NAME" | sed 's/[\\"]/\\&/g')
          printf 'CFBundleDisplayName = "%s";\nCFBundleName = "%s";\n' "$NAME" "$NAME" > "$DEST/InfoPlist.strings"

    postBuildScripts:
      - name: Debug builds open no documents
        basedOnDependencyAnalysis: false
        # MAC-76: the processed Info.plist is this phase's input, so Xcode runs it after
        # ProcessInfoPlistFile — without it a fresh build processed the plist last and undid the strip.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # MAC-74: Xcode registers every app it builds with Launch Services, so a Debug build (the
          # test host) showed up in Finder's Open With as "Inkpad++ Debug". Without document types it
          # never does. Release builds keep them.
          if [ "$CONFIGURATION" = "Debug" ]; then
            /usr/libexec/PlistBuddy -c "Delete :CFBundleDocumentTypes" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
          fi

  # MAC-24: privileged helper (a launchd daemon installed by postinstall); runs as root, writes one
  # file per request, only for Inkpad++ signed with the team's Developer ID and only after an
  # administrator authorized that write (MAC-55).
  InkpadHelper:
    type: tool
    platform: macOS
    sources:
      - path: Inkpad/Helper
      - path: Inkpad/Shared
    settings:
      base:
        PRODUCT_NAME: InkpadHelper
        PRODUCT_BUNDLE_IDENTIFIER: app.inkpad.Inkpad.helper
        OTHER_CODE_SIGN_FLAGS: "--identifier app.inkpad.Inkpad.helper"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # MAC-52: `inkpad file -n42` from a shell; hands upstream's options to the app.
  inkpad:
    type: tool
    platform: macOS
    sources:
      - path: Inkpad/Tool
      - path: Inkpad/CommandLine
    settings:
      base:
        PRODUCT_NAME: inkpad
        # Its Swift module must not be "inkpad": on a case-insensitive disk the test build then
        # sometimes loads it for `@testable import Inkpad` ("cannot load module 'inkpad' as 'Inkpad'").
        PRODUCT_MODULE_NAME: InkpadCLI
        PRODUCT_BUNDLE_IDENTIFIER: app.inkpad.Inkpad.cli
        OTHER_CODE_SIGN_FLAGS: "--identifier app.inkpad.Inkpad.cli"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  Inkpad++Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: InkpadTests
    settings:
      base:
        PRODUCT_NAME: Inkpad++Tests
        PRODUCT_MODULE_NAME: InkpadTests
        PRODUCT_BUNDLE_IDENTIFIER: app.inkpad.InkpadTests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: Inkpad++
