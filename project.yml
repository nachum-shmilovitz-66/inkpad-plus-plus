# XcodeGen spec — run `xcodegen` to (re)generate MacPad++.xcodeproj (the .xcodeproj is not checked in).
# Prerequisite: scripts/build-deps.sh (builds build/deps/Scintilla.framework and liblexilla.a).
name: MacPad++
options:
  bundleIdPrefix: app.macpad
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacPad++:
    type: application
    platform: macOS
    # MAC-66: APP_DISPLAY_NAME (the visible name), overridable in a gitignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/App.xcconfig
    sources:
      - path: MacPad/Sources
      - path: MacPad/Resources
      - path: MacPad/Shared
      - path: MacPad/CommandLine
    settings:
      base:
        PRODUCT_NAME: MacPad++
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_MODULE_NAME: MacPad
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad
        INFOPLIST_FILE: MacPad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: MacPad/Sources/BridgingHeader.h
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        OTHER_LDFLAGS: [-llexilla, -luchardet, -lc++]
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # A Debug build has its own bundle id: Finder / Open With never picks it over the
        # installed app, and it never shares the installed app's preferences.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad.debug
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: build/deps/Scintilla.framework
        embed: true
        codeSign: true
      # MAC-24: the helper binary goes into Contents/MacOS; postinstall copies it to
      # /Library/PrivilegedHelperTools (MAC-56).
      - target: MacPadHelper
        embed: true
        copy:
          destination: executables
      # MAC-52: the macpad command-line tool, linked into /usr/local/bin by the package.
      - target: macpad
        embed: true
        copy:
          destination: executables
    scheme:
      testTargets:
        - MacPad++Tests
      gatherCoverageData: true
    preBuildScripts:
      - name: Copy Notepad++ data files
        basedOnDependencyAnalysis: false
        script: |
          # Data files are reused verbatim from Notepad++ (vendor/ is gitignored, read-only).
          set -e
          NPP="$PROJECT_DIR/vendor/notepad-plus-plus/PowerEditor"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/npp"
          mkdir -p "$DEST"
          cp "$NPP/src/langs.model.xml" "$NPP/src/stylers.model.xml" "$DEST/"
          rsync -a --delete "$NPP/installer/themes/" "$DEST/themes/"
          rsync -a --delete "$NPP/installer/functionList/" "$DEST/functionList/"
      - name: Localized display name
        basedOnDependencyAnalysis: false
        script: |
          # MAC-66: Finder, the Dock and Spotlight show the file name (MacPad++.app) unless the
          # bundle has a localized name (LSHasLocalizedDisplayName); this one is APP_DISPLAY_NAME.
          set -e
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/en.lproj"
          mkdir -p "$DEST"
          NAME=$(printf '%s' "$APP_DISPLAY_NAME" | sed 's/[\\"]/\\&/g')
          printf 'CFBundleDisplayName = "%s";\nCFBundleName = "%s";\n' "$NAME" "$NAME" > "$DEST/InfoPlist.strings"

  # MAC-24: privileged helper (a launchd daemon installed by postinstall); runs as root, writes one
  # file per request, only for MacPad++ signed with the team's Developer ID and only after an
  # administrator authorized that write (MAC-55).
  MacPadHelper:
    type: tool
    platform: macOS
    sources:
      - path: MacPad/Helper
      - path: MacPad/Shared
    settings:
      base:
        PRODUCT_NAME: MacPadHelper
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad.helper
        OTHER_CODE_SIGN_FLAGS: "--identifier app.macpad.MacPad.helper"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # MAC-52: `macpad file -n42` from a shell; hands Notepad++'s options to the app.
  macpad:
    type: tool
    platform: macOS
    sources:
      - path: MacPad/Tool
      - path: MacPad/CommandLine
    settings:
      base:
        PRODUCT_NAME: macpad
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPad.cli
        OTHER_CODE_SIGN_FLAGS: "--identifier app.macpad.MacPad.cli"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
      configs:
        # MAC-59: Release builds carry the hardened runtime themselves, not only after make-pkg re-signs.
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  MacPad++Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacPadTests
    settings:
      base:
        PRODUCT_NAME: MacPad++Tests
        PRODUCT_MODULE_NAME: MacPadTests
        PRODUCT_BUNDLE_IDENTIFIER: app.macpad.MacPadTests
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/build/deps
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: MacPad++
